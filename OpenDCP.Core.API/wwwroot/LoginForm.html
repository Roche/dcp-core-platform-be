<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>open-dcp.ai - Identity Provider</title>
    <style>
        .login-page {
            width: 360px;
            padding: 8% 0 0;
            margin: auto;
        }

        .form {
            position: relative;
            z-index: 1;
            background: #FFFFFF;
            max-width: 360px;
            margin: 0 auto 100px;
            padding: 45px;
            text-align: center;
            box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            border-radius: .75rem;
        }

            .form input {
                font-family: "Roboto", sans-serif;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                padding: 15px;
                box-sizing: border-box;
                font-size: 14px;
            }

            .form button {
                font-family: "Roboto", sans-serif;
                text-transform: uppercase;
                outline: 0;
                background: #17C5A8;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #FFFFFF;
                font-size: 14px;
                -webkit-transition: all 0.5s ease;
                transition: all 0.5s ease;
                cursor: pointer;
            }

                .form button:hover,
                .form button:active,
                .form button:focus {
                    background: #00ABA5;
                }

        html {
            height: 100%;
            padding: 0;
            margin: 0;
        }

        body {
            background: linear-gradient(0deg, #00ABA5 0%, #17C5A8 50%);
            font-family: "Roboto", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        #error-message {
            font-size: smaller;
            margin-bottom: 1.5rem;
            color: red;
        }

        #dcp-link {
            font-size: smaller;
            margin-top: 20px;
            display: block;
            text-decoration: none;
            color: #999999;
        }

            #dcp-link:hover {
                color: #00ABA5;
                transition: color 0.5s ease;
            }

        #dcp-logo {
            width: 25%;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="form">
            <form class="login-form" action="/api/v2/sign-in" method="POST">
                <img id="dcp-logo" alt="" src="logo.png" />
                <input type="text" name="username" placeholder="Username" />
                <input type="password" name="password" placeholder="Password" />
                <button>Login</button> <!-- NOSONAR -->
            </form>
            <a id="dcp-link" href="https://open-dcp.ai" target="_blank">open-dcp.ai</a>
        </div>
    </div>
</body>
</html>
