<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Email</title>
</head>
<body style="margin:0; padding:0; background-color:#f6f6f6; font-family: Arial, Helvetica, sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f6f6f6">
        <tr>
            <td align="center" style="padding:20px 10px;">

                <!-- Container -->
                <table width="600" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff; border:1px solid #e9e9e9; border-radius:4px;">

                    <!-- Logo -->
                    <tr>
                        <td align="center" style="padding:20px;">
                            {{DCPLOGO}}
                        </td>
                    </tr>

                    <!-- Greeting -->
                    <tr>
                        <td style="padding:0 20px 20px; font-size:14px; color:#333;">
                            Hello <strong>{{USERDISPLAYNAME}}</strong>,
                        </td>
                    </tr>

                    <!-- Message Body -->
                    <tr>
                        <td style="padding:0 20px 20px; font-size:14px; color:#333;">
                            {{MESSAGEBODY}}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding:20px; font-size:14px; color:#333;">
                            Thanks,<br />
                            <strong>Your DCP Team</strong>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
